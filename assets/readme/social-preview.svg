<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Web Printer 3.0 — 专注长文档与业务报表的内容感知分页引擎</title>
  <desc id="og-desc">保留打印视图布局，智能按内容分页，避免文字腰斩与长文档白屏，可靠导出 PDF 与逐页 PNG。</desc>

  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7f4"/>
      <stop offset="100%" stop-color="#ebf1ec"/>
    </linearGradient>
    <filter id="og-shadow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#14211a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#og-bg)"/>

  <!-- Left Identity Area -->
  <g transform="translate(80, 70)">
    <!-- Brand Mark Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="44" height="44" rx="10" fill="#245e48"/>
      <path d="M11 16.5 L22 11 L33 16.5 L22 22 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M11 21.5 L22 27 L33 21.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M11 27.5 L22 33 L33 27.5" fill="none" stroke="#8de0b8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="56" y="30" fill="#245e48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="1.5">WEB PRINTER 3.0</text>
    <rect x="230" y="10" width="180" height="26" rx="13" fill="#dfede3"/>
    <text x="242" y="28" fill="#245e48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">CONTENT-AWARE ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="125" fill="#18221b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Web Printer</text>
    <text x="0" y="180" fill="#245e48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="700">专注长文档与业务报表的内容感知分页</text>
    <text x="0" y="222" fill="#58685c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-style="italic">Print what you see. Break where it makes sense.</text>

    <!-- Sub Features -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="42" height="3" fill="#245e48"/>
      <text x="0" y="36" fill="#324338" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600">文字行与表格行安全断点 · 逐页分块渲染 · 离屏沙盒快照</text>
      <text x="0" y="66" fill="#66776b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">避免半行腰斩 · 50+ 页超长文档不白屏 · 零宿主 DOM 污染</text>
    </g>

    <!-- Links / Footer -->
    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="90" height="30" rx="6" fill="#18221b"/>
      <text x="45" y="20" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="13" font-weight="600">PDF 导出</text>

      <rect x="100" y="0" width="110" height="30" rx="6" fill="#ffffff" stroke="#245e48" stroke-width="1.5"/>
      <text x="155" y="20" text-anchor="middle" fill="#245e48" font-family="ui-monospace, monospace" font-size="13" font-weight="600">逐页 PNG 序列</text>

      <text x="235" y="21" fill="#758579" font-family="ui-monospace, monospace" font-size="14">npm i @darialan/web-printer</text>
    </g>
  </g>

  <!-- Right Visual Stack Preview -->
  <g transform="translate(820, 100)">
    <!-- Back Page 3 -->
    <rect x="40" y="0" width="260" height="390" rx="10" fill="#ffffff" stroke="#bed3c5" opacity="0.4"/>
    <!-- Middle Page 2 -->
    <rect x="20" y="16" width="260" height="390" rx="10" fill="#ffffff" stroke="#bed3c5" opacity="0.7"/>

    <!-- Front Page 1 -->
    <rect x="0" y="32" width="260" height="390" rx="10" fill="#ffffff" stroke="#245e48" stroke-width="1.8" filter="url(#og-shadow)"/>
    <path d="M0 42 Q0 32 10 32 L250 32 Q260 32 260 42 L260 68 L0 68 Z" fill="#ebf3ee"/>
    <text x="16" y="56" fill="#245e48" font-family="ui-monospace, monospace" font-size="12" font-weight="800">PAGE 1 / 3 · A4</text>
    <circle cx="240" cy="50" r="4" fill="#245e48"/>

    <!-- Mock Document Lines -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="130" height="9" rx="2" fill="#18221b"/>
      <rect x="0" y="16" width="70" height="5" rx="1" fill="#7a8c80"/>

      <rect x="0" y="34" width="220" height="4" rx="1" fill="#cbd4cd"/>
      <rect x="0" y="44" width="200" height="4" rx="1" fill="#cbd4cd"/>
      <rect x="0" y="54" width="210" height="4" rx="1" fill="#cbd4cd"/>

      <!-- Table -->
      <rect x="0" y="74" width="220" height="70" rx="3" fill="#ffffff" stroke="#b4cfbf"/>
      <rect x="0" y="74" width="220" height="18" rx="3" fill="#e8f2eb"/>
      <rect x="10" y="81" width="40" height="4" fill="#245e48"/>
      <rect x="150" y="81" width="30" height="4" fill="#245e48"/>

      <rect x="10" y="100" width="60" height="3" fill="#66776b"/>
      <rect x="150" y="100" width="40" height="3" fill="#66776b"/>
      <line x1="0" y1="110" x2="220" y2="110" stroke="#ebf2ed"/>

      <rect x="10" y="118" width="65" height="3" fill="#66776b"/>
      <rect x="150" y="118" width="35" height="3" fill="#66776b"/>
      <line x1="0" y1="128" x2="220" y2="128" stroke="#ebf2ed"/>

      <rect x="10" y="136" width="55" height="3" fill="#66776b"/>
      <rect x="150" y="136" width="45" height="3" fill="#66776b"/>

      <!-- Clean Break Banner -->
      <g transform="translate(-20, 168)">
        <line x1="0" y1="0" x2="260" y2="0" stroke="#245e48" stroke-width="2" stroke-dasharray="5 3"/>
        <rect x="55" y="-11" width="150" height="22" rx="4" fill="#245e48"/>
        <text x="130" y="4" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="700">&#10003; CONTENT BREAK</text>
      </g>

      <rect x="0" y="190" width="220" height="60" rx="4" fill="#f8faf8" stroke="#d5e2d8" stroke-dasharray="2 2"/>
      <text x="110" y="222" text-anchor="middle" fill="#245e48" font-family="sans-serif" font-size="11" font-weight="600">文字与表格完整移至下一页</text>
      <text x="110" y="238" text-anchor="middle" fill="#7a8c80" font-family="sans-serif" font-size="10">续表头自动复制 · 杜绝半行截断</text>
    </g>

    <!-- Footer Page Indicator -->
    <text x="130" y="396" text-anchor="middle" fill="#7a8c80" font-family="ui-monospace, monospace" font-size="10">Page 1 / 3</text>
  </g>
</svg>
