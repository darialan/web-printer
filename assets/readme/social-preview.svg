<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Web Printer — 浏览器内的 HTML 分页引擎</title>
  <desc id="og-desc">把长网页按内容分页，保留样式，导出 PDF 或逐页 PNG。</desc>

  <rect width="1280" height="640" fill="#f4f6f2"/>

  <g transform="translate(80 52) scale(0.9)" fill="#202321">
    <path d="M3 8 23 2.5v12l-3-.8V6.6L6 10.4v16.1l7.5-2v3.3L3 30.6Z" stroke="#202321" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="m25.5 11 11.5 3.4v16L16 36V24.6l3 .8v6.5L34 28V16.8l-8.5-2.5Z" stroke="#202321" stroke-width="1.9" stroke-linejoin="round"/>
    <path fill="#32745d" d="M9.5 17.5c5.8-2.7 9.1-2.1 14-.5l7 2.2v6.4l-10.1-3.3c-4.1-1.3-6.5-.8-10.9 1Z"/>
  </g>
  <text x="128" y="80" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.6">CLIENT-SIDE HTML PAGINATION</text>

  <text x="80" y="214" fill="#202321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="88" font-weight="700" letter-spacing="-1.6">Web Printer</text>
  <text x="80" y="280" fill="#3d453f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="30">把长网页按内容分页，</text>
  <text x="80" y="322" fill="#3d453f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="30">导出 PDF 或逐页 PNG。</text>

  <rect x="80" y="360" width="52" height="3" fill="#32745d"/>
  <text x="80" y="400" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">TypeScript &#183; 浏览器内运行 &#183; 零服务端</text>

  <text x="80" y="566" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">github.com/darialan/web-printer</text>
  <text x="1200" y="566" fill="#6f7a72" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">npm i @darialan/web-printer</text>

  <!-- source page -->
  <g>
    <rect x="780" y="130" width="190" height="330" fill="#ffffff" stroke="#cbd3cb"/>
    <path d="M954 130h16v16Z" fill="#e6ece6"/>
    <path d="M954 130 970 146" stroke="#cbd3cb"/>
    <rect x="800" y="152" width="112" height="10" fill="#202321" opacity="0.78"/>
    <rect x="800" y="170" width="72" height="6" fill="#b9c1b9"/>
    <rect x="800" y="192" width="150" height="5" fill="#ccd4cc"/>
    <rect x="800" y="204" width="136" height="5" fill="#ccd4cc"/>
    <rect x="800" y="216" width="146" height="5" fill="#ccd4cc"/>
    <rect x="800" y="228" width="112" height="5" fill="#ccd4cc"/>

    <rect x="800" y="248" width="150" height="60" fill="#fbeceb" stroke="#cf4a4a"/>
    <rect x="800" y="248" width="4" height="60" fill="#cf4a4a"/>
    <rect x="816" y="268" width="98" height="5" fill="#e0b4b4"/>
    <rect x="816" y="280" width="74" height="5" fill="#e0b4b4"/>

    <rect x="800" y="318" width="150" height="52" fill="#eaf1fb" stroke="#3f7fd6" stroke-dasharray="6 4"/>
    <rect x="816" y="336" width="116" height="5" fill="#b9cdec"/>
    <rect x="816" y="348" width="92" height="5" fill="#b9cdec"/>
    <rect x="800" y="386" width="126" height="5" fill="#ccd4cc"/>
    <rect x="800" y="398" width="142" height="5" fill="#ccd4cc"/>
  </g>

  <path d="M988 295h42" stroke="#32745d" stroke-width="2.5"/>
  <polygon points="1040,295 1028,288 1028,302" fill="#32745d"/>

  <!-- output pages -->
  <g>
    <rect x="1112" y="154" width="130" height="210" fill="#ffffff" stroke="#cbd3cb"/>
    <rect x="1091" y="142" width="130" height="210" fill="#ffffff" stroke="#cbd3cb"/>
    <rect x="1070" y="130" width="130" height="210" fill="#ffffff" stroke="#cbd3cb"/>
    <path d="M1184 130h16v16Z" fill="#e6ece6"/>
    <path d="M1184 130 1200 146" stroke="#cbd3cb"/>

    <rect x="1088" y="152" width="82" height="8" fill="#202321" opacity="0.78"/>
    <rect x="1088" y="168" width="50" height="5" fill="#b9c1b9"/>
    <rect x="1088" y="188" width="94" height="5" fill="#ccd4cc"/>
    <rect x="1088" y="200" width="86" height="5" fill="#ccd4cc"/>
    <rect x="1088" y="212" width="92" height="5" fill="#ccd4cc"/>

    <rect x="1088" y="234" width="94" height="60" fill="#ffffff" stroke="#d8ded8"/>
    <rect x="1088" y="234" width="94" height="13" fill="#eef1ed"/>
    <rect x="1088" y="247" width="94" height="13" fill="#fbeceb"/>
    <rect x="1088" y="247" width="3" height="13" fill="#cf4a4a"/>
    <path d="M1088 260h94M1088 273h94" stroke="#d8ded8"/>

    <text x="1152" y="318" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">1 / 3</text>
  </g>

  <text x="1070" y="394" fill="#244c3a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">PDF</text>
  <text x="1070" y="430" fill="#32745d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">PNG &#215;3</text>
  <text x="1070" y="468" fill="#6f7a72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">同一份分页结果</text>
</svg>
