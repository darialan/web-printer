      <line x1="14" y1="30" x2="210" y2="30" stroke="#ebf2ed"/>

      <!-- Auto Repeated Table Header (#281) -->
      <g transform="translate(14, 40)">
        <rect x="0" y="0" width="196" height="88" rx="2" fill="#ffffff" stroke="#d5dfd8"/>
        <rect x="0" y="0" width="196" height="16" fill="#e8f2eb"/>
        <rect x="6" y="6" width="40" height="4" fill="#1b4d3a"/>
        <rect x="126" y="6" width="30" height="4" fill="#1b4d3a"/>
        <text x="190" y="11" text-anchor="end" fill="#245e48" font-family="ui-monospace, monospace" font-size="7">[续表头]</text>

        <rect x="6" y="24" width="62" height="3" fill="#66776b"/>
        <rect x="126" y="24" width="42" height="3" fill="#66776b"/>
        <line x1="0" y1="34" x2="196" y2="34" stroke="#eef2ef"/>

        <rect x="6" y="42" width="58" height="3" fill="#66776b"/>
        <rect x="126" y="42" width="36" height="3" fill="#66776b"/>
        <line x1="0" y1="52" x2="196" y2="52" stroke="#eef2ef"/>

        <rect x="6" y="60" width="50" height="3" fill="#66776b"/>
        <rect x="126" y="60" width="30" height="3" fill="#66776b"/>
      </g>

      <!-- Signature & Stamp Block (Protected atomically) -->
      <g transform="translate(14, 140)">
        <rect x="0" y="0" width="196" height="96" rx="4" fill="#fbfdfb" stroke="#bad4c2"/>
        <text x="10" y="18" fill="#18221b" font-family="sans-serif" font-size="9" font-weight="700">审计复核签字栏 (Atomic Block)</text>
        <line x1="10" y1="56" x2="110" y2="56" stroke="#88998c"/>
        <text x="10" y="68" fill="#7a8c80" font-family="sans-serif" font-size="8">首席审计师：张 * * (CPA)</text>

        <!-- Mock Seal Stamp -->
        <circle cx="156" cy="50" r="24" fill="none" stroke="#d44b4b" stroke-width="1.5" stroke-dasharray="3 1.5"/>
        <circle cx="156" cy="50" r="20" fill="none" stroke="#d44b4b" stroke-width="0.8"/>
        <text x="156" y="53" text-anchor="middle" fill="#d44b4b" font-family="sans-serif" font-size="7" font-weight="700">审计专用章</text>
